name: Terraria diagnostic IPA
run-name: Terraria 4.5.4 Unity memory pools 20261026
on:
  workflow_dispatch:
    inputs:
      validate_mac:
        description: Also compile macOS shaders
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: terraria-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'wcc526/nxnative-cloud-build' && github.ref == 'refs/heads/main' && github.actor == 'wcc526'
    runs-on: macos-15
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check required credential
        env:
          PRIVATE_BUILD_READ_TOKEN: ${{ secrets.PRIVATE_BUILD_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_BUILD_READ_TOKEN" ]; then
            echo '::error::Configure the read-only PRIVATE_BUILD_READ_TOKEN repository secret first.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verified encryption utility
        run: python scripts/install_age.py
      - name: Checkout reviewed private build source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: wcc526/nxnative-private-build
          ref: 89d80c4f7d87395fa94d9d8663cf8579e3605d0e
          token: ${{ secrets.PRIVATE_BUILD_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Install Apple build dependencies
        timeout-minutes: 30
        run: |
          xcodebuild -version
          brew install xcodegen
          python -m pip install -r private-source/scripts/cloud-requirements.txt
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version
      - name: Compile with private logs and encrypt results
        env:
          PRIVATE_BUILD_READ_TOKEN: ${{ secrets.PRIVATE_BUILD_READ_TOKEN }}
          VALIDATE_MAC: ${{ inputs.validate_mac }}
        run: python scripts/run_terraria.py
      - name: Upload encrypted result only
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-build-result
          path: ${{ runner.temp }}/nx-public-output/build-result.tar.age
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
