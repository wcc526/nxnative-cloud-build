name: Donkey Kong Bananza 3.2.0 IPA
run-name: Bananza 3.2.0 encrypted NX2Apple build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bananza-320
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'wcc526/nxnative-cloud-build' && github.actor == 'wcc526'
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select Apple compiler
        shell: bash
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then
            echo DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer >> "$GITHUB_ENV"
          elif [ -d /Applications/Xcode-27.2.app ]; then
            echo DEVELOPER_DIR=/Applications/Xcode-27.2.app/Contents/Developer >> "$GITHUB_ENV"
          fi
          ls -d /Applications/Xcode*.app
          xcodebuild -version
      - name: Install build dependencies
        timeout-minutes: 30
        run: |
          brew install xcodegen zstd glslang
          dotnet --list-sdks
          python -m pip install lz4 capstone==5.0.6 fonttools backports.zstd
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version
          python scripts/install_age.py
      - name: Compile and encrypt
        env:
          BANANZA_INPUT_URLS: ${{ secrets.BANANZA_INPUT_URLS }}
        run: python scripts/run_bananza.py
      - name: Upload encrypted result
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bananza-encrypted-result
          path: ${{ runner.temp }}/nx-public-output/build-result.tar.age
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
