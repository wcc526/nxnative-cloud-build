name: Bananza Apple environment probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Inspect Apple compilers
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          dotnet --list-sdks
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version
          xcrun -sdk iphoneos --show-sdk-version
