name: Splatoon Raiders 1.1.0 IPA
run-name: Splatoon Raiders 1.1.0 encrypted NX2Apple build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: splatoon-raiders-110
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'wcc526/nxnative-cloud-build' && github.actor == 'wcc526'
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select Apple compiler
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcodebuild -version | head -1 | grep -Fx 'Xcode 27.2'
          xcrun -sdk iphoneos --show-sdk-version
      - name: Install build dependencies
        timeout-minutes: 30
        run: |
          brew install xcodegen zstd glslang dotnet@10
          echo "$(brew --prefix dotnet@10)/bin" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$(brew --prefix dotnet@10)/libexec" >> "$GITHUB_ENV"
          dotnet --list-sdks
          python -m pip install lz4 capstone==5.0.6 fonttools backports.zstd
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version
          python scripts/install_age.py
      - name: Compile and encrypt
        env:
          SPLATOON_INPUT_URLS: ${{ secrets.SPLATOON_INPUT_URLS }}
        run: python scripts/run_splatoon.py
      - name: Upload encrypted result
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: splatoon-encrypted-result
          path: ${{ runner.temp }}/nx-public-output/build-result.tar.age
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
