name: Export encrypted Hades II result
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: hades-encrypted-export
  cancel-in-progress: false
jobs:
  export:
    if: github.repository == 'wcc526/nxnative-cloud-build' && github.ref == 'refs/heads/main' && github.actor == 'wcc526'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: wcc526/nxnative-cloud-build
    steps:
      - name: Verify successful source run and download encrypted artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/wcc526/nxnative-cloud-build/actions/runs/40065463025 > run.json
          python3 - <<'PY'
          import json
          r = json.load(open('run.json'))
          assert r['conclusion'] == 'success'
          assert r['head_sha'] == '30c1f4c2360089d2bca54ec17a4644e6b3c589bb'
          assert r['path'] == '.github/workflows/hades.yml'
          PY
          gh run download 40065463025 --name encrypted-build-result --dir result
          python3 - <<'PY'
          from pathlib import Path
          p = Path('result/build-result.tar.age')
          assert list(Path('result').iterdir()) == [p]
          assert 0 < p.stat().st_size < 1024**3
          with p.open('rb') as f:
              assert f.read(22) == b'age-encryption.org/v1\n'
          PY
      - name: Publish encrypted output for reliable download
        shell: bash
        run: |
          set -euo pipefail
          cd result
          sha256sum build-result.tar.age > build-result.tar.age.sha256
          gh release create hades-runtime-20261024 build-result.tar.age build-result.tar.age.sha256 --target "$GITHUB_SHA" --prerelease --title 'Encrypted Hades II diagnostic build' --notes 'Encrypted output from successful run 40065463025. Requires the local owner identity to decrypt; contains no plaintext game files.'
